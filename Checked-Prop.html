<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checked-Prop</title>
    
    <style>
        *{
            margin: 0;
        }
        body{
            margin: 0;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            font-size: 1.5rem;
            background-color: darkred;
            color: white;
        }
        .b-container{
            place-items: center;
        }
        .trayz{
            background-color: aliceblue;
            display: flex;
        }
        h1{
            color: rgb(122, 101, 6);
            font-size: 2rem;
        }
        h1::first-letter{
            font-size: 2.8rem;
            color: crimson;
        }
        nav{
            margin-left: 11.5rem;
           display: flex;
           /* border: 1px solid green; */
        }
        @media screen 
  and (min-device-width: 1370px) 
  and (max-device-width: 1600px) 
  { 
    nav{
        /* border: 1px solid red; */
        margin-left: 50.5rem;
        
    }
}
        li{
            margin-top: 0.7rem;
            list-style: none;
        }
        a{
            background-color: darkgoldenrod;
            justify-content: space-evenly;
            padding: 0.4rem 1rem;
            margin-left: 1rem;
            border-radius: 0.5rem;
            text-decoration: none;
            color: white;
            font-size: 1rem;
            box-shadow: 1px 1px 1px 1px gray;
        }
        #mySubmit{
            font-size: 1rem;
            padding: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="trayz">
        <h1>TRAYZ BANK</h1>
        <nav><li><a href="">sign up</a></li>
        <li><a href="">sign in</a></li></nav>
    </div>
    
    <div class="b-container">
        <input type="checkbox" id="myCheckBox">
        <label for="myCheckBox">Subscribe</label><br>
        <input type="radio" name="rad" id="visaBtn">
        <label for="visaBtn">Visa</label><br>
        <input type="radio"  name="rad" id="mastercardBtn">
        <label for="masterBtn">Mastercard</label><br>
        <input type="radio"  name="rad" id="paypalBtn">
        <label for="paypalBtn">Paypal</label><br>
        <br>
        <button type="submit" onclick="mySubmit()">Submit</button>
        <p id="subResult"></p>
        <p id="paymentResult"></p>
    </div>
    <script src="./Checked-Prop.js">
        
    </script>
</body>
</html>
